      <section class="page-hero">
        <p class="eyebrow">ALLEEN VOOR CAST</p>
        <h2>Acteurportaal</h2>
        <p class="page-lead">Log in om het interne cast-dashboard te openen.</p>
      </section>
      <section class="content">
        <form class="login-box" id="loginForm">
          <h3>Inloggen</h3>
          <p class="muted">Gebruik je castaccount.</p>
          <label for="email">E-mailadres</label>
          <input id="email" type="email" autocomplete="email" required>
          <label for="password">Wachtwoord</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button class="button primary submit" type="submit">Inloggen</button>
          <p class="error" id="loginError" aria-live="polite">
          </p>
        </form>
      </section>
    </main>
